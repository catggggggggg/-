<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>モンストガイドマスター</title>
  
  <!-- ホーム画面追加用のアイコン -->
  <link rel="icon" type="image/jpeg" href="モンストガイドマスターアイコン.jpg">
  <link rel="apple-touch-icon" href="モンストガイドマスターアイコン.jpg">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { overscroll-behavior: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; background-color: #020617; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
  </style>
</head>
<body class="bg-slate-950 text-slate-200">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;

    // --- Icons ---
    const IconCrosshair = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="22" y1="12" x2="18" y2="12"/><line x1="6" y1="12" x2="2" y2="12"/><line x1="12" y1="6" x2="12" y2="2"/><line x1="12" y1="22" x2="12" y2="18"/></svg>;
    const IconUpload = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>;
    const IconUnlock = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>;
    const IconLock = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>;
    const IconRefresh = () => <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>;
    const IconTrash = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;
    const IconCheck = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>;
    const IconSave = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>;
    const IconWrench = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>;

    const App = () => {
      // 保存された前回セッションを読み込む
      const initialSession = React.useMemo(() => {
        try {
          const saved = localStorage.getItem('monst_current_session');
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return {};
      }, []);

      const [imageSrc, setImageSrc] = useState(initialSession.imageSrc || null);
      const [image, setImage] = useState(null);
      const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);

      // imageSrc が変わったら Image オブジェクトを生成する
      useEffect(() => {
        if (imageSrc) {
          const img = new Image();
          img.onload = () => setImage(img);
          img.src = imageSrc;
        } else {
          setImage(null);
          setShowDeleteConfirm(false);
        }
      }, [imageSrc]);

      const [startPoint, setStartPoint] = useState(initialSession.startPoint || { x: 195, y: 500 });
      const [angle, setAngle] = useState(initialSession.angle ?? 45);
      const [isMoveMode, setIsMoveMode] = useState(false); // true: ロック(ON), false: 解除(OFF)

      // App Settings
      const [maxBounces, setMaxBounces] = useState(initialSession.maxBounces ?? 3);
      const [showReverseGuide, setShowReverseGuide] = useState(initialSession.showReverseGuide ?? true);
      const [showBand, setShowBand] = useState(initialSession.showBand ?? false);
      const [showTrajectory, setShowTrajectory] = useState(initialSession.showTrajectory ?? true);
      const [showWallLine, setShowWallLine] = useState(initialSession.showWallLine ?? true);
      const [lineColor, setLineColor] = useState(initialSession.lineColor || 'white');
      const [warpSize, setWarpSize] = useState(initialSession.warpSize || 25); // ワープの大きさ

      // Wall Settings
      const defaultWalls = { top: 19, bottom: 33, left: 5, right: 5 };
      const tabletWalls = { top: 24, bottom: 36, left: 14, right: 14 };
      const [wallPercents, setWallPercents] = useState(initialSession.wallPercents || defaultWalls);

      // Obstacles & Warps
      const [obstacles, setObstacles] = useState(initialSession.obstacles || []);
      const [warps, setWarps] = useState(initialSession.warps || []);
      const [obsMode, setObsMode] = useState('edit'); 
      const [selectedIds, setSelectedIds] = useState([]); 
      const [obsType, setObsType] = useState('block');
      const [activeTab, setActiveTab] = useState('aim'); 

      // Save States
      const [saveName, setSaveName] = useState('');
      const [savedStages, setSavedStages] = useState(() => {
        try { return JSON.parse(localStorage.getItem('monst_saved_stages') || '[]'); } catch (e) { return []; }
      });

      // 毎回の変更を自動でセーブする処理 (オートセーブ)
      useEffect(() => {
        const stateToSave = {
          startPoint, angle, maxBounces, showReverseGuide, showBand, showTrajectory, 
          showWallLine, lineColor, warpSize, wallPercents, obstacles, warps, imageSrc
        };
        try {
          localStorage.setItem('monst_current_session', JSON.stringify(stateToSave));
        } catch (e) {
          // 画像データが大きすぎて容量オーバーになった場合は、画像以外を保存
          try {
             localStorage.setItem('monst_current_session', JSON.stringify({ ...stateToSave, imageSrc: null }));
          } catch (e2) {}
        }
      }, [startPoint, angle, maxBounces, showReverseGuide, showBand, showTrajectory, showWallLine, lineColor, warpSize, wallPercents, obstacles, warps, imageSrc]);

      const canvasRef = useRef(null);
      const fileInputRef = useRef(null);
      
      // Refs for immediate interaction state (fixes drag bugs)
      const dragModeRef = useRef(null);
      const obsDragRef = useRef(null);
      const activePointerIdRef = useRef(null);

      const canvasWidth = 390;
      const canvasHeight = 844;

      const bounds = {
        left: canvasWidth * (wallPercents.left / 100),
        right: canvasWidth * (1 - wallPercents.right / 100),
        top: canvasHeight * (wallPercents.top / 100),
        bottom: canvasHeight * (1 - wallPercents.bottom / 100),
      };

      const cropMargin = 20; 
      const viewBounds = {
        left: Math.max(0, bounds.left - cropMargin),
        right: Math.min(canvasWidth, bounds.right + cropMargin),
        top: Math.max(0, bounds.top - cropMargin),
        bottom: Math.min(canvasHeight, bounds.bottom + cropMargin),
      };
      const viewWidth = viewBounds.right - viewBounds.left;
      const viewHeight = viewBounds.bottom - viewBounds.top;

      // 壁の設定が変わった際に、スタート地点が枠からはみ出さないよう自動補正する処理
      useEffect(() => {
        setStartPoint(prev => {
          const clampedX = Math.max(bounds.left, Math.min(prev.x, bounds.right));
          const clampedY = Math.max(bounds.top, Math.min(prev.y, bounds.bottom));
          if (clampedX !== prev.x || clampedY !== prev.y) {
            return { x: clampedX, y: clampedY };
          }
          return prev;
        });
      }, [bounds.left, bounds.right, bounds.top, bounds.bottom]);

      const handleSaveStage = () => {
        if (!saveName.trim()) return;
        const newStage = { id: Date.now(), name: saveName.trim(), obstacles, warps, wallPercents, warpSize, date: new Date().toLocaleDateString('ja-JP') };
        const updated = [newStage, ...savedStages];
        setSavedStages(updated);
        localStorage.setItem('monst_saved_stages', JSON.stringify(updated));
        setSaveName('');
      };

      const handleLoadStage = (stage) => {
        setObstacles(stage.obstacles || []);
        setWarps(stage.warps || []);
        if (stage.wallPercents) setWallPercents(stage.wallPercents);
        if (stage.warpSize) setWarpSize(stage.warpSize);
      };

      const handleDeleteStage = (id) => {
        const updated = savedStages.filter(s => s.id !== id);
        setSavedStages(updated);
        localStorage.setItem('monst_saved_stages', JSON.stringify(updated));
      };

      const handleImageUpload = (e) => {
        const file = e.target.files?.[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              // 画像をリサイズ・圧縮するための見えないキャンバスを作成
              const canvas = document.createElement('canvas');
              const ctx = canvas.getContext('2d');
              
              // ブラウザの保存容量制限(約5MB)を回避するため、長辺を最大1200pxに縮小
              const MAX_SIZE = 1200;
              let width = img.width;
              let height = img.height;
              
              if (width > height && width > MAX_SIZE) {
                height *= MAX_SIZE / width;
                width = MAX_SIZE;
              } else if (height > MAX_SIZE) {
                width *= MAX_SIZE / height;
                height = MAX_SIZE;
              }
              
              canvas.width = width;
              canvas.height = height;
              ctx.drawImage(img, 0, 0, width, height);
              
              // JPEG形式で圧縮（画質70%）してデータ量を大幅に削減
              const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
              setImageSrc(compressedDataUrl);
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        }
      };

      const handleRemoveImage = () => {
        setImageSrc(null);
        setImage(null);
        setShowDeleteConfirm(false);
        if (fileInputRef.current) fileInputRef.current.value = '';
      };

      const getCanvasCoords = (clientX, clientY) => {
        const canvas = canvasRef.current;
        if (!canvas) return null;
        const rect = canvas.getBoundingClientRect();
        const scaleX = viewWidth / rect.width;
        const scaleY = viewHeight / rect.height;
        return {
          x: (clientX - rect.left) * scaleX + viewBounds.left,
          y: (clientY - rect.top) * scaleY + viewBounds.top
        };
      };

      // --- Interaction Start ---
      const startInteraction = (coords) => {
        dragModeRef.current = null;
        obsDragRef.current = null;
        if (!coords) return;

        // スタート地点（白丸）は常に最優先で動かせるようにする
        if (Math.hypot(coords.x - startPoint.x, coords.y - startPoint.y) < 60) {
          dragModeRef.current = 'origin';
          return;
        }

        if (activeTab === 'obstacles') {
          if (obsMode === 'delete') {
            const hitObs = obstacles.find(o => coords.x >= o.x && coords.x <= o.x + o.w && coords.y >= o.y && coords.y <= o.y + o.h);
            if (hitObs) { setSelectedIds(prev => prev.includes(hitObs.id) ? prev.filter(id => id !== hitObs.id) : [...prev, hitObs.id]); return; }
            const hitWarp = warps.find(w => Math.hypot(coords.x - w.in.x, coords.y - w.in.y) < warpSize || Math.hypot(coords.x - w.out.x, coords.y - w.out.y) < warpSize);
            if (hitWarp) { setSelectedIds(prev => prev.includes(hitWarp.id) ? prev.filter(id => id !== hitWarp.id) : [...prev, hitWarp.id]); return; }
            
            // 何もヒットしなかった場合は選択解除
            setSelectedIds([]);
            return;
          }

          if (obsMode === 'edit') {
            // ワープの選択・移動
            for (const warp of warps) {
              const distIn = Math.hypot(coords.x - warp.in.x, coords.y - warp.in.y);
              const distOut = Math.hypot(coords.x - warp.out.x, coords.y - warp.out.y);
              const threshold = warpSize + 10;

              if (distIn < threshold || distOut < threshold) {
                setSelectedIds([warp.id]);
                // より近い方を確実に掴む。全く同じ距離(重なっている)場合はOUTを優先して引き剥がせるようにする
                if (distIn < distOut) {
                  dragModeRef.current = 'warp-in'; 
                  obsDragRef.current = { id: warp.id, offsetX: warp.in.x - coords.x, offsetY: warp.in.y - coords.y }; 
                } else {
                  dragModeRef.current = 'warp-out'; 
                  obsDragRef.current = { id: warp.id, offsetX: warp.out.x - coords.x, offsetY: warp.out.y - coords.y }; 
                }
                return;
              }
            }

            // ブロックの四隅（サイズ変更） - 選択されているブロックのみ判定
            const cornerSize = 24; 
            for (const o of obstacles) {
              if (selectedIds.includes(o.id)) {
                const corners = [
                  { type: 'lt', x: o.x, y: o.y }, { type: 'rt', x: o.x + o.w, y: o.y },
                  { type: 'lb', x: o.x, y: o.y + o.h }, { type: 'rb', x: o.x + o.w, y: o.y + o.h }
                ];
                for (const c of corners) {
                  if (Math.abs(coords.x - c.x) < cornerSize && Math.abs(coords.y - c.y) < cornerSize) {
                     obsDragRef.current = { id: o.id, type: c.type, offsetX: c.x - coords.x, offsetY: c.y - coords.y }; return;
                  }
                }
              }
            }
            
            // ブロックの移動 (タップ判定用の座標も記録)
            for (const o of obstacles) {
              if (coords.x >= o.x && coords.x <= o.x + o.w && coords.y >= o.y && coords.y <= o.y + o.h) {
                obsDragRef.current = { id: o.id, type: 'move', offsetX: o.x - coords.x, offsetY: o.y - coords.y, startX: coords.x, startY: coords.y, isTap: true }; return;
              }
            }
            
            // 何もヒットしなかった場合は選択解除
            setSelectedIds([]);
          }
        }

        if (activeTab === 'aim' || activeTab === 'walls') {
          dragModeRef.current = 'angle';
          updateAngleFromCoords(coords);
        }
      };

      const moveInteraction = (coords) => {
        if (!coords) return;
        
        // IN側の移動処理（OUT側には絶対に干渉しない構造に変更）
        if (dragModeRef.current === 'warp-in') {
          const { id, offsetX, offsetY } = obsDragRef.current;
          setWarps(prev => prev.map(w => {
            if (w.id === id) {
              return { ...w, in: { x: coords.x + offsetX, y: coords.y + offsetY } };
            }
            return w;
          }));
          return;
        }

        // OUT側の移動処理（IN側には絶対に干渉しない構造に変更）
        if (dragModeRef.current === 'warp-out') {
          const { id, offsetX, offsetY } = obsDragRef.current;
          setWarps(prev => prev.map(w => {
            if (w.id === id) {
              return { ...w, out: { x: coords.x + offsetX, y: coords.y + offsetY } };
            }
            return w;
          }));
          return;
        }

        if (obsDragRef.current && obsDragRef.current.type) {
          const { id, type, offsetX, offsetY, startX, startY } = obsDragRef.current;
          const targetX = coords.x + offsetX;
          const targetY = coords.y + offsetY;

          if (type === 'move') {
            if (obsDragRef.current.isTap) {
              const dx = Math.abs(coords.x - startX);
              const dy = Math.abs(coords.y - startY);
              if (dx > 5 || dy > 5) {
                obsDragRef.current.isTap = false; // 動かしたらタップ判定を解除してドラッグに移行
              }
            }
            if (!obsDragRef.current.isTap) {
              setObstacles(prev => prev.map(o => o.id === id ? { ...o, x: targetX, y: targetY } : o));
            }
            return;
          }

          setObstacles(prev => prev.map(o => {
            if (o.id === id) {
              let nx = o.x, ny = o.y, nw = o.w, nh = o.h;
              if (type.includes('l')) { const right = o.x + o.w; nx = targetX; nw = right - nx; }
              if (type.includes('r')) { nw = targetX - o.x; }
              if (type.includes('t')) { const bottom = o.y + o.h; ny = targetY; nh = bottom - ny; }
              if (type.includes('b')) { nh = targetY - o.y; }
              if (nw < 20) { if (type.includes('l')) nx = o.x + o.w - 20; nw = 20; }
              if (nh < 20) { if (type.includes('t')) ny = o.y + o.h - 20; nh = 20; }
              return { ...o, x: nx, y: ny, w: nw, h: nh };
            }
            return o;
          }));
          return;
        }

        if (dragModeRef.current === 'origin') {
          const clampedX = Math.max(bounds.left, Math.min(coords.x, bounds.right));
          const clampedY = Math.max(bounds.top, Math.min(coords.y, bounds.bottom));
          setStartPoint({ x: clampedX, y: clampedY });
        } else if (dragModeRef.current === 'angle') {
          updateAngleFromCoords(coords);
        }
      };

      const handleEnd = () => {
        if (obsDragRef.current && obsDragRef.current.isTap && obsDragRef.current.type === 'move') {
          // タップされた場合、ブロックの選択状態(四隅ハンドルの表示)をトグル
          const hitId = obsDragRef.current.id;
          if (activeTab === 'obstacles' && obsMode === 'edit') {
            setSelectedIds(prev => prev.includes(hitId) ? prev.filter(id => id !== hitId) : [hitId]);
          }
        }

        dragModeRef.current = null;
        obsDragRef.current = null;
      };

      const updateAngleFromCoords = (coords) => {
        const dx = coords.x - startPoint.x;
        const dy = coords.y - startPoint.y;
        let newAngle = Math.atan2(dy, dx) * (180 / Math.PI);
        if (newAngle < 0) newAngle += 360;
        const angleStep = 360 / 1024;
        // 1024段階の正確なインデックスに丸める
        let index = Math.round(newAngle / angleStep) % 1024;
        if (index < 0) index += 1024;
        setAngle(index * angleStep);
      };

      // Add Element Helpers
      const addBlock = () => {
        const newId = Date.now();
        setObstacles([...obstacles, { id: newId, x: bounds.left + 100, y: bounds.top + 100, w: 60, h: 60 }]);
        setSelectedIds([newId]);
      };
      const addWarp = () => {
        const newId = Date.now();
        setWarps([...warps, { id: newId, in: { x: bounds.left + 50, y: bounds.top + 100 }, out: { x: bounds.left + 150, y: bounds.top + 100 }, outAngle: null }]);
        setSelectedIds([newId]);
      };

      // --- Calculate Path ---
      const calculatePath = useCallback(() => {
        const path = [{ x: startPoint.x, y: startPoint.y, nx: 0, ny: 0, type: 'normal' }];
        let rad = angle * (Math.PI / 180);
        let vx = Math.cos(rad);
        let vy = Math.sin(rad);
        let currentX = startPoint.x;
        let currentY = startPoint.y;

        const usedWarpIds = new Set();
        const EPSILON = 0.5;

        for (let i = 0; i < maxBounces; i++) {
          if (currentX <= bounds.left + EPSILON && vx < 0) vx = -vx;
          if (currentX >= bounds.right - EPSILON && vx > 0) vx = -vx;
          if (currentY <= bounds.top + EPSILON && vy < 0) vy = -vy;
          if (currentY >= bounds.bottom - EPSILON && vy > 0) vy = -vy;

          let tMin = Infinity;
          let nextX = currentX;
          let nextY = currentY;
          let hitNormalX = 0;
          let hitNormalY = 0;
          let hitWarp = null;

          if (vx > 0) { let t = (bounds.right - currentX) / vx; if (t > 0.1 && t < tMin) { let y = currentY + t * vy; if (y >= bounds.top - 0.5 && y <= bounds.bottom + 0.5) { tMin = t; nextX = bounds.right; nextY = y; hitNormalX = -1; hitNormalY = 0; } } }
          if (vx < 0) { let t = (bounds.left - currentX) / vx; if (t > 0.1 && t < tMin) { let y = currentY + t * vy; if (y >= bounds.top - 0.5 && y <= bounds.bottom + 0.5) { tMin = t; nextX = bounds.left; nextY = y; hitNormalX = 1; hitNormalY = 0; } } }
          if (vy > 0) { let t = (bounds.bottom - currentY) / vy; if (t > 0.1 && t < tMin) { let x = currentX + t * vx; if (x >= bounds.left - 0.5 && x <= bounds.right + 0.5) { tMin = t; nextX = x; nextY = bounds.bottom; hitNormalX = 0; hitNormalY = -1; } } }
          if (vy < 0) { let t = (bounds.top - currentY) / vy; if (t > 0.1 && t < tMin) { let x = currentX + t * vx; if (x >= bounds.left - 0.5 && x <= bounds.right + 0.5) { tMin = t; nextX = x; nextY = bounds.top; hitNormalX = 0; hitNormalY = 1; } } }

          for (const obs of obstacles) {
            if (vx > 0) { let t = (obs.x - currentX) / vx; if (t > 0.1 && t < tMin) { let y = currentY + t * vy; if (y >= obs.y - 0.5 && y <= obs.y + obs.h + 0.5) { tMin = t; nextX = obs.x; nextY = y; hitNormalX = -1; hitNormalY = 0; } } }
            if (vx < 0) { let t = ((obs.x + obs.w) - currentX) / vx; if (t > 0.1 && t < tMin) { let y = currentY + t * vy; if (y >= obs.y - 0.5 && y <= obs.y + obs.h + 0.5) { tMin = t; nextX = obs.x + obs.w; nextY = y; hitNormalX = 1; hitNormalY = 0; } } }
            if (vy > 0) { let t = (obs.y - currentY) / vy; if (t > 0.1 && t < tMin) { let x = currentX + t * vx; if (x >= obs.x - 0.5 && x <= obs.x + obs.w + 0.5) { tMin = t; nextX = x; nextY = obs.y; hitNormalX = 0; hitNormalY = -1; } } }
            if (vy < 0) { let t = ((obs.y + obs.h) - currentY) / vy; if (t > 0.1 && t < tMin) { let x = currentX + t * vx; if (x >= obs.x - 0.5 && x <= obs.x + obs.w + 0.5) { tMin = t; nextX = x; nextY = obs.y + obs.h; hitNormalX = 0; hitNormalY = 1; } } }
          }

          for (const w of warps) {
            if (usedWarpIds.has(w.id)) continue;
            const a = vx * vx + vy * vy;
            const b = 2 * (vx * (currentX - w.in.x) + vy * (currentY - w.in.y));
            const c = (currentX - w.in.x) * (currentX - w.in.x) + (currentY - w.in.y) * (currentY - w.in.y) - warpSize * warpSize;
            const discriminant = b * b - 4 * a * c;
            if (discriminant >= 0) {
              const t1 = (-b - Math.sqrt(discriminant)) / (2 * a);
              if (t1 > 0.1 && t1 < tMin) { tMin = t1; nextX = currentX + t1 * vx; nextY = currentY + t1 * vy; hitNormalX = 0; hitNormalY = 0; hitWarp = w; }
            }
          }

          if (tMin === Infinity) break;
          
          path.push({ x: nextX, y: nextY, nx: hitNormalX, ny: hitNormalY, type: hitWarp ? 'warpIn' : 'normal' });

          if (hitWarp) {
            usedWarpIds.add(hitWarp.id);
            path.push({ x: hitWarp.out.x, y: hitWarp.out.y, nx: 0, ny: 0, type: 'warpOut' });
            currentX = hitWarp.out.x;
            currentY = hitWarp.out.y;
            if (hitWarp.outAngle !== null) {
              const r = hitWarp.outAngle * (Math.PI / 180);
              vx = Math.cos(r); vy = Math.sin(r);
            }
          } else {
            if (hitNormalX !== 0) vx = -vx;
            if (hitNormalY !== 0) vy = -vy;
            currentX = nextX;
            currentY = nextY;
          }
        }
        return path;
      }, [startPoint, angle, wallPercents, maxBounces, canvasWidth, canvasHeight, obstacles, warps, warpSize]);

      // --- Render Canvas ---
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        canvas.width = viewWidth * dpr;
        canvas.height = viewHeight * dpr;
        ctx.scale(dpr, dpr);
        ctx.translate(-viewBounds.left, -viewBounds.top);
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);

        // 背景画像
        if (image) {
          ctx.save();
          const imgAspect = image.width / image.height;
          const canvasAspect = canvasWidth / canvasHeight;
          let drawW = imgAspect > canvasAspect ? canvasWidth : canvasHeight * imgAspect;
          let drawH = imgAspect > canvasAspect ? canvasWidth / imgAspect : canvasHeight;
          ctx.translate(canvasWidth / 2, canvasHeight / 2);
          ctx.drawImage(image, -drawW / 2, -drawH / 2, drawW, drawH);
          ctx.restore();
        } else {
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(0, 0, canvasWidth, canvasHeight);
          ctx.fillStyle = '#334155';
          ctx.font = '16px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('右上のボタンから画像をアップロード', canvasWidth / 2, canvasHeight / 2);
        }

        // 壁の枠線
        if (showWallLine) {
          ctx.strokeStyle = '#10b981'; ctx.lineWidth = 2; ctx.setLineDash([8, 8]);
          ctx.strokeRect(bounds.left, bounds.top, bounds.right - bounds.left, bounds.bottom - bounds.top);
          ctx.setLineDash([]);
        }

        // 障害物
        obstacles.forEach(o => {
          const isSelected = selectedIds.includes(o.id);
          const isDeleteMode = isSelected && obsMode === 'delete' && activeTab === 'obstacles';
          const isEditMode = isSelected && obsMode === 'edit' && activeTab === 'obstacles';
          
          let fillColor = 'rgba(245, 158, 11, 0.4)';
          let strokeColor = '#f59e0b';

          if (isDeleteMode) {
            fillColor = 'rgba(239, 68, 68, 0.5)';
            strokeColor = '#ef4444';
          } else if (isEditMode) {
            fillColor = 'rgba(252, 211, 77, 0.6)'; // 薄く光る色
            strokeColor = '#fcd34d';
          }

          ctx.fillStyle = fillColor;
          if (isEditMode) { ctx.shadowColor = strokeColor; ctx.shadowBlur = 10; }
          ctx.fillRect(o.x, o.y, o.w, o.h);
          ctx.shadowBlur = 0;

          ctx.strokeStyle = strokeColor;
          ctx.lineWidth = 2;
          if (isEditMode) { ctx.shadowColor = strokeColor; ctx.shadowBlur = 10; }
          ctx.strokeRect(o.x, o.y, o.w, o.h);
          ctx.shadowBlur = 0;

          // 編集中ハンドル (選択されたブロックのみ表示)
          if (isEditMode) {
            const corners = [
              { x: o.x, y: o.y }, { x: o.x + o.w, y: o.y },
              { x: o.x, y: o.y + o.h }, { x: o.x + o.w, y: o.y + o.h }
            ];
            corners.forEach(c => {
              ctx.beginPath(); ctx.arc(c.x, c.y, 8, 0, Math.PI * 2); ctx.fillStyle = '#10b981'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
            });
          }
        });

        // ワープ
        warps.forEach(w => {
          const isSelected = selectedIds.includes(w.id);
          const isDeleteMode = isSelected && obsMode === 'delete' && activeTab === 'obstacles';
          const isEditMode = isSelected && obsMode === 'edit' && activeTab === 'obstacles';

          let strokeIn = '#3b82f6', fillIn = 'rgba(59, 130, 246, 0.4)';
          let strokeOut = '#f97316', fillOut = 'rgba(249, 115, 22, 0.4)';

          if (isDeleteMode) {
            strokeIn = strokeOut = '#ef4444';
            fillIn = fillOut = 'rgba(239, 68, 68, 0.5)';
          } else if (isEditMode) {
            strokeIn = '#93c5fd'; fillIn = 'rgba(147, 197, 253, 0.6)'; // 薄い青
            strokeOut = '#fdba74'; fillOut = 'rgba(253, 186, 116, 0.6)'; // 薄いオレンジ
          }

          ctx.beginPath(); ctx.moveTo(w.in.x, w.in.y); ctx.lineTo(w.out.x, w.out.y);
          ctx.strokeStyle = isDeleteMode ? '#ef4444' : 'rgba(59, 130, 246, 0.6)'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
          
          if (isEditMode) { ctx.shadowColor = strokeIn; ctx.shadowBlur = 10; }
          ctx.beginPath(); ctx.arc(w.in.x, w.in.y, warpSize, 0, Math.PI * 2); ctx.fillStyle = fillIn; ctx.fill(); ctx.strokeStyle = strokeIn; ctx.lineWidth = 2; ctx.stroke();
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#fff'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('IN', w.in.x, w.in.y);
          
          if (isEditMode) { ctx.shadowColor = strokeOut; ctx.shadowBlur = 10; }
          ctx.beginPath(); ctx.arc(w.out.x, w.out.y, warpSize, 0, Math.PI * 2); ctx.fillStyle = fillOut; ctx.fill(); ctx.strokeStyle = strokeOut; ctx.lineWidth = 2; ctx.stroke();
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#fff'; ctx.fillText('OUT', w.out.x, w.out.y);
        });

        let mainColor = '#06b6d4', glowColor = 'rgba(6, 182, 212, 0.4)';
        if (lineColor === 'white') { mainColor = '#ffffff'; glowColor = 'rgba(255, 255, 255, 0.4)'; }
        else if (lineColor === 'black') { mainColor = '#000000'; glowColor = 'rgba(0, 0, 0, 0.4)'; }

        // 引っ張る目安 (showTrajectoryがオフでも独立して表示)
        if (showReverseGuide) {
          const boundsCenter = { x: bounds.left + (bounds.right - bounds.left) / 2, y: bounds.top + (bounds.bottom - bounds.top) / 2 };
          const revRad = (angle + 180) * (Math.PI / 180);
          const revVx = Math.cos(revRad), revVy = Math.sin(revRad);
          const distToEdge = (x, y, vx, vy, b) => {
            let tx = Infinity, ty = Infinity;
            if (vx > 0) tx = (b.right - x) / vx; if (vx < 0) tx = (b.left - x) / vx;
            if (vy > 0) ty = (b.bottom - y) / vy; if (vy < 0) ty = (b.top - y) / vy;
            return Math.min(tx, ty);
          };
          const d1 = distToEdge(boundsCenter.x, boundsCenter.y, -revVx, -revVy, bounds);
          const pt1 = { x: boundsCenter.x - revVx * d1, y: boundsCenter.y - revVy * d1 };
          const d2 = distToEdge(boundsCenter.x, boundsCenter.y, revVx, revVy, bounds);
          const pt2 = { x: boundsCenter.x + revVx * d2, y: boundsCenter.y + revVy * d2 };

          ctx.beginPath(); ctx.moveTo(pt1.x, pt1.y); ctx.lineTo(pt2.x, pt2.y);
          ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3; ctx.stroke();
          ctx.beginPath(); ctx.arc(pt1.x, pt1.y, 5, 0, Math.PI * 2); ctx.fillStyle = '#dc2626'; ctx.fill(); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
        }

        // 軌道
        if (showTrajectory) {
          const path = calculatePath();
          if (path.length > 1) {
            if (showBand) {
              ctx.beginPath(); ctx.moveTo(path[0].x, path[0].y);
              for (let i = 1; i < path.length; i++) {
                if (path[i].type === 'warpOut') ctx.moveTo(path[i].x, path[i].y);
                else ctx.lineTo(path[i].x, path[i].y);
              }
              ctx.strokeStyle = glowColor; ctx.lineWidth = 20; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
            }

            ctx.beginPath(); ctx.moveTo(path[0].x, path[0].y);
            for (let i = 1; i < path.length; i++) {
              if (path[i].type === 'warpOut') ctx.moveTo(path[i].x, path[i].y);
              else ctx.lineTo(path[i].x, path[i].y);
            }
            ctx.strokeStyle = mainColor; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
          }

          // 反射回数
          let bounceCount = 0;
          path.forEach((p, i) => {
            if (i > 0 && p.type !== 'warpIn' && p.type !== 'warpOut') {
              bounceCount++;
              const offset = 14;
              const textX = p.x - p.nx * offset; const textY = p.y - p.ny * offset;
              ctx.beginPath(); ctx.arc(textX, textY, 8, 0, Math.PI * 2); ctx.fillStyle = lineColor === 'white' ? '#e2e8f0' : '#1e293b'; ctx.fill();
              ctx.strokeStyle = mainColor; ctx.lineWidth = 1.5; ctx.stroke();
              ctx.fillStyle = lineColor === 'white' ? '#0f172a' : '#f8fafc'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(bounceCount.toString(), textX, textY);
            }
          });
        }

        // スタート地点
        ctx.beginPath(); ctx.arc(startPoint.x, startPoint.y, 5, 0, Math.PI * 2); ctx.fillStyle = mainColor; ctx.fill(); ctx.strokeStyle = lineColor === 'white' ? '#000000' : '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
        ctx.beginPath(); ctx.arc(startPoint.x, startPoint.y, 28, 0, Math.PI * 2); ctx.strokeStyle = mainColor; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);

      }, [image, startPoint, angle, wallPercents, maxBounces, showReverseGuide, showBand, showTrajectory, showWallLine, lineColor, obstacles, warps, warpSize, selectedIds, viewWidth, viewHeight, calculatePath, obsMode, activeTab]);

      const isSmartphone = wallPercents.top === defaultWalls.top && wallPercents.bottom === defaultWalls.bottom && wallPercents.left === defaultWalls.left && wallPercents.right === defaultWalls.right;
      const isTablet = wallPercents.top === tabletWalls.top && wallPercents.bottom === tabletWalls.bottom && wallPercents.left === tabletWalls.left && wallPercents.right === tabletWalls.right;

      return (
        <div className="relative h-[100dvh] bg-slate-950 text-slate-200 flex flex-col font-sans select-none overflow-hidden max-w-2xl mx-auto w-full">
          
          <header className="flex items-center justify-between p-3 bg-slate-900 border-b border-slate-800 shrink-0">
            <h1 className="text-sm sm:text-base font-bold text-slate-100 tracking-wide flex items-center gap-1.5">
              <span className="text-teal-400"><IconCrosshair /></span> モンストガイドマスター
            </h1>
            <div className="flex items-center gap-2">
              {imageSrc && (
                showDeleteConfirm ? (
                  <div className="flex items-center gap-1 bg-red-950/80 border border-red-500/50 rounded-lg p-0.5">
                    <button 
                      onClick={handleRemoveImage} 
                      className="px-2 py-1 bg-red-600 text-white rounded text-[10px] font-bold active:bg-red-700 transition-colors"
                    >
                      削除する
                    </button>
                    <button 
                      onClick={() => setShowDeleteConfirm(false)} 
                      className="px-1.5 py-1 text-slate-400 hover:text-slate-200 text-[10px] font-bold"
                    >
                      取消
                    </button>
                  </div>
                ) : (
                  <button 
                    onClick={() => setShowDeleteConfirm(true)} 
                    className="flex items-center gap-1.5 bg-red-500/20 text-red-400 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-red-500/30 transition-colors border border-red-500/30"
                  >
                    画像を削除
                  </button>
                )
              )}
              <label className="flex items-center gap-1.5 bg-teal-500/20 text-teal-400 px-3 py-1.5 rounded-lg text-xs font-bold cursor-pointer hover:bg-teal-500/30 transition-colors border border-teal-500/30">
                <IconUpload /> 画像
                <input type="file" accept="image/*" className="hidden" onChange={handleImageUpload} ref={fileInputRef} />
              </label>
            </div>
          </header>

      <div className="relative flex-1 bg-slate-950 overflow-hidden flex items-center justify-center p-2">
        <canvas
          ref={canvasRef}
          onPointerDown={(e) => {
            if (isMoveMode) return;
            // 既に別の指で操作中なら完全に無視（安全対策強化）
            if (activePointerIdRef.current !== null && activePointerIdRef.current !== e.pointerId) return; 
            activePointerIdRef.current = e.pointerId;
            e.target.setPointerCapture(e.pointerId);
            startInteraction(getCanvasCoords(e.clientX, e.clientY));
          }}
          onPointerMove={(e) => {
            if (isMoveMode) return;
            if (activePointerIdRef.current !== e.pointerId) return; // 自分の指以外は無視
            if (dragModeRef.current || obsDragRef.current) {
              moveInteraction(getCanvasCoords(e.clientX, e.clientY));
            }
          }}
          onPointerUp={(e) => {
            if (isMoveMode) return;
            if (activePointerIdRef.current === e.pointerId) {
              try { e.target.releasePointerCapture(e.pointerId); } catch(e){}
              handleEnd();
              activePointerIdRef.current = null;
            }
          }}
          onPointerCancel={(e) => {
            if (isMoveMode) return;
            if (activePointerIdRef.current === e.pointerId) {
              try { e.target.releasePointerCapture(e.pointerId); } catch(e){}
              handleEnd();
              activePointerIdRef.current = null;
            }
          }}
          style={{ touchAction: isMoveMode ? 'auto' : 'none', aspectRatio: `${viewWidth} / ${viewHeight}` }}
          className="max-w-full max-h-full object-contain rounded-lg shadow-2xl border border-slate-800"
        />
      </div>

      <div className="p-3 bg-slate-900 border-t border-slate-800 shrink-0 pb-safe">
            <div className="flex border-b border-slate-800 mb-3">
              {['aim', 'walls', 'obstacles', 'save'].map(tab => (
                <button
                  key={tab}
                  onClick={() => setActiveTab(tab)}
                  className={`flex-1 py-2 text-xs font-bold transition-colors border-b-2 flex justify-center items-center gap-1 ${activeTab === tab ? 'border-teal-400 text-teal-400' : 'border-transparent text-slate-500 hover:text-slate-300'}`}
                >
                  {tab === 'aim' && '射出設定'}
                  {tab === 'walls' && '壁設定'}
                  {tab === 'obstacles' && 'ギミック'}
                  {tab === 'save' && <><IconSave /> 保存</>}
                </button>
              ))}
            </div>

            <div className="h-[200px] overflow-y-auto pr-1">
              {activeTab === 'aim' && (
                <div className="space-y-4 pb-24">
                  <div className="flex justify-between items-center text-xs">
                    <span className="text-slate-400">発射角度 (1024分割 / 1段=約0.35°)</span>
                    <span className="bg-slate-800 px-2 py-1 rounded font-mono text-slate-200 border border-slate-700">
                      {Math.round(angle / (360/1024))}段 ({angle.toFixed(2)}°)
                    </span>
                  </div>
                  <input type="range" min="0" max="1023" step="1" value={Math.round(angle / (360/1024)) % 1024} onChange={(e) => setAngle(parseInt(e.target.value) * (360/1024))} className="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-teal-400" />
                  <div className="flex justify-between gap-1">
                    <button onClick={() => setAngle(a => (((Math.round(a / (360/1024)) - 10) % 1024 + 1024) % 1024) * (360/1024))} className="flex-1 py-2 bg-slate-800 text-slate-300 rounded text-xs font-bold active:bg-slate-700 border border-slate-700">-10段</button>
                    <button onClick={() => setAngle(a => (((Math.round(a / (360/1024)) - 1) % 1024 + 1024) % 1024) * (360/1024))} className="flex-1 py-2 bg-slate-800 text-slate-300 rounded text-xs font-bold active:bg-slate-700 border border-slate-700">-1段</button>
                    <button onClick={() => setAngle(a => (((Math.round(a / (360/1024)) + 1) % 1024 + 1024) % 1024) * (360/1024))} className="flex-1 py-2 bg-slate-800 text-slate-300 rounded text-xs font-bold active:bg-slate-700 border border-slate-700">+1段</button>
                    <button onClick={() => setAngle(a => (((Math.round(a / (360/1024)) + 10) % 1024 + 1024) % 1024) * (360/1024))} className="flex-1 py-2 bg-slate-800 text-slate-300 rounded text-xs font-bold active:bg-slate-700 border border-slate-700">+10段</button>
                  </div>
                  <div className="flex justify-between gap-1">
                    <button onClick={() => setShowTrajectory(!showTrajectory)} className={`flex-1 py-2 rounded text-xs font-bold border transition-colors ${showTrajectory ? 'bg-teal-500/20 text-teal-400 border-teal-500/30' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>線 {showTrajectory ? 'ON' : 'OFF'}</button>
                    <button onClick={() => setShowBand(!showBand)} className={`flex-1 py-2 rounded text-xs font-bold border transition-colors ${showBand ? 'bg-teal-500/20 text-teal-400 border-teal-500/30' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>幅 {showBand ? 'ON' : 'OFF'}</button>
                    <button onClick={() => setShowReverseGuide(!showReverseGuide)} className={`flex-1 py-2 rounded text-xs font-bold border transition-colors ${showReverseGuide ? 'bg-red-500/20 text-red-400 border-red-500/30' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>目安 {showReverseGuide ? 'ON' : 'OFF'}</button>
                    <button onClick={() => setMaxBounces(prev => prev >= 15 ? 1 : prev + 1)} className="flex-1 py-2 bg-slate-800 text-slate-300 rounded text-xs font-bold border border-slate-700">反射 {maxBounces}回</button>
                    <button onClick={() => setLineColor(prev => prev === 'white' ? 'black' : prev === 'black' ? 'cyan' : 'white')} className="flex-1 py-2 bg-slate-800 text-slate-300 rounded text-xs font-bold border border-slate-700">
                      {lineColor === 'white' ? '白 ●' : lineColor === 'black' ? '黒 ●' : '水 ●'}
                    </button>
                  </div>
                  <button onClick={() => setIsMoveMode(!isMoveMode)} className={`w-full py-3 mt-2 rounded-md text-sm font-bold flex items-center justify-center gap-2 transition-colors border ${isMoveMode ? 'bg-yellow-500/20 text-yellow-400 border-yellow-500/30' : 'bg-slate-800 text-slate-300 border-slate-700'}`}>
                    {isMoveMode ? <><IconLock /> 画面移動モード：ON (射出ロック中)</> : <><IconUnlock /> 画面移動モード：OFF (射出可能)</>}
                  </button>
                </div>
              )}

              {activeTab === 'walls' && (
                <div className="space-y-4 pb-24">
                  <div className="flex gap-2">
                    <button onClick={() => setWallPercents(defaultWalls)} className={`flex-1 py-2 rounded text-xs font-bold border transition-colors ${isSmartphone ? 'bg-teal-500/20 text-teal-400 border-teal-500/30' : 'bg-slate-800 text-slate-300 border-slate-700'}`}>📱 スマホ (初期)</button>
                    <button onClick={() => setWallPercents(tabletWalls)} className={`flex-1 py-2 rounded text-xs font-bold border transition-colors ${isTablet ? 'bg-teal-500/20 text-teal-400 border-teal-500/30' : 'bg-slate-800 text-slate-300 border-slate-700'}`}>タブレット/iPad</button>
                  </div>
                  <div className="flex justify-between items-center text-xs">
                    <span className="text-slate-400">壁の範囲設定 (%)</span>
                    <div className="flex gap-2">
                      <button onClick={() => setShowWallLine(!showWallLine)} className={`px-2 py-1 rounded border ${showWallLine ? 'bg-teal-500/20 text-teal-400 border-teal-500/30' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>枠線 {showWallLine ? 'ON' : 'OFF'}</button>
                      <button onClick={() => setWallPercents(defaultWalls)} className="px-2 py-1 bg-slate-800 text-slate-300 rounded border border-slate-700 flex items-center gap-1"><IconRefresh /> リセット</button>
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-x-4 gap-y-3">
                    {['top', 'bottom', 'left', 'right'].map((side) => (
                      <div key={side}>
                        <div className="flex justify-between text-xs mb-1">
                          <span className="text-slate-400">{side === 'top' ? '上' : side === 'bottom' ? '下' : side === 'left' ? '左' : '右'}</span>
                          <span className="text-slate-200 font-mono">{wallPercents[side]}%</span>
                        </div>
                        <input type="range" min="0" max="40" value={wallPercents[side]} onChange={(e) => setWallPercents({...wallPercents, [side]: parseInt(e.target.value)})} className="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-teal-400" />
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {activeTab === 'obstacles' && (
                <div className="space-y-4 pb-24">
                  <div className="flex gap-2">
                    <button onClick={() => setObsMode('edit')} className={`flex-1 py-2 rounded text-xs font-bold border transition-colors flex items-center justify-center gap-1.5 ${obsMode === 'edit' ? 'bg-amber-500/20 text-amber-400 border-amber-500/30' : 'bg-slate-800 text-slate-400 border-slate-700'}`}><IconWrench /> 配置・編集</button>
                    <button onClick={() => setObsMode('delete')} className={`flex-1 py-2 rounded text-xs font-bold border transition-colors flex items-center justify-center gap-1.5 ${obsMode === 'delete' ? 'bg-red-500/20 text-red-400 border-red-500/30' : 'bg-slate-800 text-slate-400 border-slate-700'}`}><IconTrash /> 選択・削除</button>
                  </div>
                  
                  {obsMode === 'edit' ? (
                    <div className="space-y-3">
                      <div className="flex gap-2">
                         <button onClick={addBlock} className="flex-1 py-2 bg-slate-800 text-slate-300 rounded text-xs font-bold active:bg-slate-700 border border-slate-700">＋ ブロックを追加</button>
                         <button onClick={addWarp} className="flex-1 py-2 bg-slate-800 text-slate-300 rounded text-xs font-bold active:bg-slate-700 border border-slate-700">＋ テレポートを追加</button>
                      </div>

                      <div className="mt-2 bg-slate-800/50 p-2 rounded-lg border border-slate-700">
                        {obstacles.filter(o => selectedIds.includes(o.id)).length > 0 ? (
                          <div className="space-y-3">
                            <div>
                              <div className="flex justify-between text-xs mb-2">
                                <span className="text-slate-400">ブロックの大きさ (比率維持)</span>
                                <span className="text-slate-200 font-mono">{Math.round(obstacles.find(o => selectedIds.includes(o.id)).w)}px</span>
                              </div>
                              <input type="range" min="20" max="300" value={Math.round(obstacles.find(o => selectedIds.includes(o.id)).w)} onChange={(e) => {
                                const val = parseInt(e.target.value);
                                setObstacles(prev => prev.map(o => {
                                  if (selectedIds.includes(o.id)) {
                                    const ratio = o.h / o.w;
                                    return { ...o, w: val, h: val * ratio };
                                  }
                                  return o;
                                }));
                              }} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-amber-400" />
                            </div>
                          </div>
                        ) : warps.filter(w => selectedIds.includes(w.id)).length > 0 ? (
                          <div>
                            <div className="flex justify-between text-xs mb-2">
                              <span className="text-slate-400">テレポートの大きさ (半径)</span>
                              <span className="text-slate-200 font-mono">{warpSize}px</span>
                            </div>
                            <input type="range" min="10" max="60" value={warpSize} onChange={(e) => setWarpSize(parseInt(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-400" />
                          </div>
                        ) : (
                          <p className="text-[10px] text-slate-500 text-center py-1">画面上のギミックをタップして選択すると、<br/>ここにサイズ変更スライダーが表示されます。</p>
                        )}
                      </div>
                      <p className="text-[10px] text-slate-500 mt-2">画面中央に追加された障害物をドラッグで移動・変形できます。</p>
                    </div>
                  ) : (
                    <div className="space-y-3">
                      <p className="text-xs text-slate-400">消したいブロックやテレポートをタップして赤く選択してください。</p>
                      <div className="flex gap-2">
                        <button onClick={() => {
                          setObstacles(prev => prev.filter(o => !selectedIds.includes(o.id)));
                          setWarps(prev => prev.filter(w => !selectedIds.includes(w.id)));
                          setSelectedIds([]);
                        }} disabled={selectedIds.length === 0} className={`flex-1 py-2 rounded text-xs font-bold border transition-colors ${selectedIds.length > 0 ? 'bg-red-500/20 text-red-400 border-red-500/30' : 'bg-slate-800 text-slate-600 border-slate-700 cursor-not-allowed'}`}>選択中を削除 ({selectedIds.length})</button>
                        <button onClick={() => { if(window.confirm('すべて削除しますか？')){ setObstacles([]); setWarps([]); setSelectedIds([]); } }} className="flex-1 py-2 bg-slate-800 text-red-400 rounded text-xs font-bold border border-slate-700 hover:bg-slate-700">すべて削除</button>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {activeTab === 'save' && (
                <div className="space-y-4 pb-24">
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">ステージ配置に名前を付けて保存</label>
                    <div className="flex gap-2">
                      <input type="text" value={saveName} onChange={(e) => setSaveName(e.target.value)} placeholder="例：〇〇ステージ2" className="flex-1 bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm text-slate-200 outline-none focus:border-teal-500" />
                      <button onClick={handleSaveStage} disabled={!saveName.trim()} className={`px-4 py-2 rounded text-xs font-bold border transition-colors flex items-center gap-1 ${saveName.trim() ? 'bg-teal-500/20 text-teal-400 border-teal-500/30' : 'bg-slate-800 text-slate-600 border-slate-700 cursor-not-allowed'}`}><IconSave /> 保存</button>
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs text-slate-400 mb-2">保存済みリスト ({savedStages.length})</label>
                    <div className="space-y-2 max-h-32 overflow-y-auto pr-1">
                      {savedStages.length === 0 ? (
                        <p className="text-xs text-slate-500 text-center py-4">保存された配置はありません</p>
                      ) : (
                        savedStages.map(stage => (
                          <div key={stage.id} className="flex items-center justify-between bg-slate-800/50 border border-slate-700 p-2 rounded">
                            <div>
                              <div className="text-sm text-slate-200 font-bold">{stage.name}</div>
                              <div className="text-[10px] text-slate-500">{stage.date} - 障害物: {(stage.obstacles?.length||0) + (stage.warps?.length||0)}</div>
                            </div>
                            <div className="flex gap-2">
                              <button onClick={() => handleLoadStage(stage)} className="px-3 py-1.5 bg-teal-500/20 text-teal-400 rounded text-xs font-bold border border-teal-500/30">読込</button>
                              <button onClick={() => handleDeleteStage(stage.id)} className="p-1.5 bg-slate-800 text-slate-400 hover:text-red-400 rounded border border-slate-700"><IconTrash /></button>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
